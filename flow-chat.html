<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>פרויקט FLOW | וואטסאפ</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <!-- מעבר ממודעות FLOW לוואטסאפ של הבוט (055). ההודעה המוכנה שונה לפי אזור המודעה
         (?r=s דרום, ?r=c מרכז), כדי שהבוט ידע מאיפה הגיע הליד. -->
    <script src="pixel.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e0c0c; color: #efe9df; font-family: "Assistant", sans-serif; text-align: center; padding: 0 16px; }
        .flow { font-family: "Cormorant Garamond", serif; letter-spacing: .3em; font-size: 44px; color: #d9c9a3; direction: ltr; margin-bottom: 18px; }
        p { color: #a59d94; margin: 0 0 28px; }
        a { display: inline-block; border: 1.5px solid #d9c9a3; border-radius: 999px; padding: 14px 34px; color: #efe9df; text-decoration: none; font-weight: 600; font-size: 18px; }
    </style>
</head>
<body>
    <main>
        <div class="flow">FLOW</div>
        <p>פותחים את הוואטסאפ…</p>
        <a id="go" href="https://wa.me/972552845920">לשיחה בוואטסאפ</a>
    </main>
    <script>
        (function () {
            var TEXT = {
                s: 'היי, ראיתי את המודעה של FLOW ואשמח לפרטים',
                c: 'היי, ראיתי את המודעה של FLOW ואשמח לשמוע פרטים'
            };
            var r = new URLSearchParams(location.search).get('r');
            var url = 'https://wa.me/972552845920?text=' + encodeURIComponent(TEXT[r] || TEXT.s);
            document.getElementById('go').href = url;
            fbq('track', 'Contact', { content_name: '/flow-chat.html' + (r ? '?r=' + r : '') });
            // רגע קצר כדי שהפיקסל יספיק לשלוח לפני שהדף מתחלף
            setTimeout(function () { location.href = url; }, 600);
        })();
    </script>
</body>
</html>
