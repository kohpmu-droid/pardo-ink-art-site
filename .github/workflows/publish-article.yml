name: Publish daily article

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC ≈ 09:00 Israel
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish next queued article
        run: python tools/publish_from_queue.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "pardo-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "מאמר יומי (אוטומטי מהענן)"
            git push
            echo "committed"
          else
            echo "no changes"
          fi
