<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Pardo Ink Art — Tattoo & Piercing">
  <defs>
    <radialGradient id="wine" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#743243"/>
      <stop offset="62%" stop-color="#5e2b3a"/>
      <stop offset="100%" stop-color="#3c1e29"/>
    </radialGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ink-blot stamp -->
  <circle cx="300" cy="300" r="236" fill="url(#wine)" filter="url(#ink)"/>

  <!-- ink splatter accents -->
  <g fill="#5e2b3a" filter="url(#inkFine)">
    <circle cx="512" cy="212" r="7"/>
    <circle cx="95"  cy="360" r="5"/>
    <circle cx="470" cy="470" r="9"/>
    <circle cx="140" cy="150" r="4"/>
  </g>

  <!-- brushed inner ring -->
  <circle cx="300" cy="300" r="202" fill="none" stroke="#f6ece6" stroke-opacity="0.45" stroke-width="3" filter="url(#inkFine)"/>

  <!-- wordmark -->
  <g fill="#f7efe9" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Frank Ruhl Libre', serif">
    <text x="300" y="278" font-size="118" font-weight="700" letter-spacing="6">PARDO</text>
    <text x="300" y="332" font-size="47" font-weight="600" letter-spacing="20">INK ART</text>
    <line x1="196" y1="360" x2="404" y2="360" stroke="#f7efe9" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="300" y="400" font-size="28" font-weight="600" letter-spacing="6">TATTOO &amp; PIERCING</text>
  </g>
</svg>
